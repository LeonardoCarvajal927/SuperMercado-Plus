
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facturación - SuperMercado Plus</title>

    <link rel="stylesheet" href="../css/facturacion.css">
</head>

<body>

    <div class="panel-principal">

        <!-- MENU LATERAL -->

        <div class="menu-lateral">

            <h2>SuperMercado <span>PLUS</span></h2>

            <a href="inicio.html" target="inicio">Inicio</a>

            <a href="inventario.html" target="inventario">Inventario</a>

            <a href="ventas.html" target="ventas">Ventas</a>

            <a href="facturacion.html" target="facturacion" class="activo">
                Facturación
            </a>

            <a href="reportes.html" target="reportes">Reportes</a>

            <a href="login.html" class="cerrar-sesion">Cerrar sesión</a>

        </div>

        <!-- CONTENIDO PRINCIPAL -->

        <div class="contenido-principal">

            <div class="encabezado">

                <p>SuperMercado Plus / Facturación</p>

                <p class="usuario">Usuario: Admin</p>

            </div>

            <h1>Facturación</h1>

            <p>Consultar el historial y detalle de las facturas.</p>

            <!-- BUSCADOR -->

            <div class="buscador">

                <label for="buscar">Buscar factura</label>

                <div class="busqueda">

                    <input
                        type="text"
                        id="buscar"
                        placeholder="Escribe el número de factura..."
                    >

                    <button type="button" id="boton-buscar">
                        Buscar
                    </button>

                </div>

            </div>

            <!-- TABLA DE FACTURAS -->

            <div class="contenedor-tabla">

                <table>

                    <thead>

                        <tr>
                            <th>Número</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody id="tabla-facturas">

                        <!-- JAVASCRIPT MOSTRARA LAS VENTAS GUARDADAS -->

                    </tbody>

                </table>

            </div>

            <!-- DETALLE DE FACTURA -->

            <div class="detalle-factura" id="detalle-factura">

                <h2>Detalle de factura</h2>

                <p id="numero-factura"></p>

                <p id="cliente-factura"></p>

                <p id="fecha-factura"></p>

                <table>

                    <thead>

                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>

                    </thead>

                    <tbody id="productos-factura">

                        <!-- JAVASCRIPT MOSTRARA LOS PRODUCTOS VENDIDOS -->

                    </tbody>

                </table>

                <h3 id="total-factura"></h3>

                <button type="button" id="cerrar-detalle">
                    Cerrar detalle
                </button>

            </div>

        </div>

    </div>

    <!-- ALMACENAMIENTO DE VENTAS -->

    <script src="../js/ventas-storage.js"></script>

    <!-- LOGICA DE FACTURACION -->

    <script src="../js/facturacion.js"></script>

</body>

</html>
